
name: Build Cinematy APKs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apks.yml'

permissions:
  contents: read

jobs:
  build-mobile:
    name: Build Mobile APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build mobile APK
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: cinematy-mobile-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

  build-tv:
    name: Build TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build TV APK
        working-directory: tv_app
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: cinematy-tv-apk
          path: tv_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
