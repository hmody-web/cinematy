workflows:
  cinematy-ios-release-unsigned:
    name: Cinematy iOS Release Unsigned ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare Flutter without replacing iOS native files
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

          # CRITICAL: Never recreate/delete ios here. AppDelegate.swift contains
          # Cinematy's native UITabBarController / Liquid Glass implementation.
          test -f ios/Runner/AppDelegate.swift
          grep -Fq 'CinematyNativeTabBarHostController' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy/native_tab_bar' ios/Runner/AppDelegate.swift
          if grep -Eq 'rm[[:space:]]+-rf[[:space:]]+ios' codemagic.yaml; then
            echo 'ERROR: codemagic.yaml must not delete the custom ios directory.'
            exit 1
          fi

      - name: Apply Cinematy iOS settings
        script: |
          set -euo pipefail

          PLIST="ios/Runner/Info.plist"
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName سينماتي" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string سينماتي" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName cinematy" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleName string cinematy" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          # Never opt the app into legacy visual compatibility; that would suppress
          # the current system design on iOS 26+.
          /usr/libexec/PlistBuddy -c "Delete :UIDesignRequiresCompatibility" "$PLIST" 2>/dev/null || true

          sed -i '' 's/com\.cinematy\.app/com.cinematy.app/g' "$PBX"
          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"

          echo "Xcode used for native system UI:"
          xcodebuild -version

      - name: Regenerate Flutter generated files and icon
        script: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons
          flutter build ios --release --config-only --no-codesign

          # flutter build must not overwrite the native host.
          grep -Fq 'CinematyNativeTabBarHostController' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy/native_tab_bar' ios/Runner/AppDelegate.swift

      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          cd ..

      - name: Verify Xcode project
        script: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -list
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          test -f ios/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned Release
        script: |
          set -euo pipefail
          rm -rf build/ios/derived

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify built app contains native iOS tab bar
        script: |
          set -euo pipefail

          APP_PATH=$(find build/ios/derived/Build/Products \
            -type d \
            -path "*Release-iphoneos/Runner.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Release Runner.app was generated."
            exit 1
          fi

          echo "$APP_PATH" > /tmp/cinematy_runner_app
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Runner"

          # This verifies the final executable — not just source files — contains
          # the exact native MethodChannel compiled from AppDelegate.swift.
          if ! strings "$APP_PATH/Runner" | grep -Fq 'cinematy/native_tab_bar'; then
            echo "ERROR: Native Cinematy iOS tab bar code is NOT inside Runner executable."
            exit 1
          fi

          if strings "$APP_PATH/Runner" | grep -Fq 'cinematy.native.liquid.tabbar'; then
            echo "Native UITabBarController marker found in final Runner executable."
          else
            echo "ERROR: Native Liquid tab bar marker missing from final executable."
            exit 1
          fi

          echo "Native iOS tab bar verification PASSED."
          du -sh "$APP_PATH"

      - name: Create unsigned ZIP
        script: |
          set -euo pipefail
          APP_PATH=$(cat /tmp/cinematy_runner_app)

          rm -rf build/ios/output
          mkdir -p build/ios/output

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            build/ios/output/Cinematy-Release-Unsigned.zip

          ZIP="build/ios/output/Cinematy-Release-Unsigned.zip"
          ls -lh "$ZIP"
          unzip -t "$ZIP"

          ZIP_BYTES=$(stat -f%z "$ZIP")
          if [ "$ZIP_BYTES" -lt 1000000 ]; then
            echo "ERROR: Final ZIP is less than 1 MB."
            exit 1
          fi

    artifacts:
      - build/ios/output/Cinematy-Release-Unsigned.zip

  cinematy-ios-debug-unsigned:
    name: Cinematy iOS Debug Unsigned ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare existing iOS project
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

          test -f ios/Runner/AppDelegate.swift
          grep -Fq 'CinematyNativeTabBarHostController' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy/native_tab_bar' ios/Runner/AppDelegate.swift

          PLIST="ios/Runner/Info.plist"
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName سينماتي" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string سينماتي" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIDesignRequiresCompatibility" "$PLIST" 2>/dev/null || true

          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"

          dart run flutter_launcher_icons
          flutter build ios --debug --config-only --no-codesign

          grep -Fq 'CinematyNativeTabBarHostController' ios/Runner/AppDelegate.swift

          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned Debug
        script: |
          set -euo pipefail
          rm -rf build/ios/derived

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and package Debug ZIP
        script: |
          set -euo pipefail

          APP_PATH=$(find build/ios/derived/Build/Products \
            -type d \
            -path "*Debug-iphoneos/Runner.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Debug Runner.app not found."
            exit 1
          fi

          test -f "$APP_PATH/Runner"
          test -f "$APP_PATH/Info.plist"

          strings "$APP_PATH/Runner" | grep -Fq 'cinematy/native_tab_bar'
          strings "$APP_PATH/Runner" | grep -Fq 'cinematy.native.liquid.tabbar'
          echo "Native iOS tab bar verification PASSED."

          rm -rf build/ios/output
          mkdir -p build/ios/output

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            build/ios/output/Cinematy-Debug-Unsigned.zip

          ZIP="build/ios/output/Cinematy-Debug-Unsigned.zip"
          ls -lh "$ZIP"

          ZIP_BYTES=$(stat -f%z "$ZIP")
          if [ "$ZIP_BYTES" -lt 1000000 ]; then
            echo "ERROR: Debug ZIP is less than 1 MB."
            exit 1
          fi

    artifacts:
      - build/ios/output/Cinematy-Debug-Unsigned.zip
