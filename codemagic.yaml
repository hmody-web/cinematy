      - name: Find built app
        script: |
          echo "Searching for Runner.app..."
          APP_PATH=$(find build -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app was not found"
            exit 1
          fi

          echo "$APP_PATH" > /tmp/runner_app_path.txt
          du -sh "$APP_PATH"

      - name: Create unsigned IPA
        script: |
          APP_PATH=$(cat /tmp/runner_app_path.txt)

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload

          cp -R "$APP_PATH" build/ios/ipa/Payload/Runner.app

          cd build/ios/ipa
          zip -qry Cinematy-Release-Unsigned.ipa Payload

          ls -lh Cinematy-Release-Unsigned.ipa

        artifacts:
      - build/ios/ipa/Cinematy-Release-Unsigned.ipa