workflows:
  ios-release-zip:
    name: Cinematy iOS Release ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Prepare iOS files
        script: |
          flutter build ios --release --config-only

      - name: Build unsigned Release
        script: |
          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          cd ..

      - name: Create ZIP
        script: |
          APP_PATH="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find build -type d -name "*.app" -print
            exit 1
          fi

          echo "Runner.app size:"
          du -sh "$APP_PATH"

          mkdir -p build/ios/output

          cd build/ios/derived/Build/Products/Release-iphoneos

          zip -qry \
            ../../../../../output/Cinematy-Release-Unsigned.zip \
            Runner.app

          cd ../../../../../..

          echo "ZIP:"
          ls -lh build/ios/output/Cinematy-Release-Unsigned.zip

    artifacts:
      - build/ios/output/Cinematy-Release-Unsigned.zip