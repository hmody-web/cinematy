workflows:
  ios-release-zip:
    name: Cinematy iOS Release ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Prepare iOS configuration only
        script: |
          flutter build ios \
            --release \
            --config-only \
            --no-codesign

      - name: Build unsigned Release
        script: |
          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          cd ..

      - name: Find Runner app
        script: |
          APP_PATH="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found"
            find build -type d -name "*.app" -print
            exit 1
          fi

          echo "Runner.app found:"
          du -sh "$APP_PATH"

      - name: Create Release ZIP
        script: |
          APP_PATH="build/ios/derived/Build/Products/Release-iphoneos/Runner.app"

          rm -rf build/ios/output
          mkdir -p build/ios/output/package

          cp -R "$APP_PATH" \
            build/ios/output/package/Runner.app

          cd build/ios/output/package
          zip -qry ../Cinematy-Release-Unsigned.zip Runner.app
          cd ../../../..

          echo "Final ZIP:"
          ls -lh build/ios/output/Cinematy-Release-Unsigned.zip

          SIZE=$(stat -f%z build/ios/output/Cinematy-Release-Unsigned.zip)

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: ZIP is suspiciously small: $SIZE bytes"
            exit 1
          fi

    artifacts:
      - build/ios/output/Cinematy-Release-Unsigned.zip