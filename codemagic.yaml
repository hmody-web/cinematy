workflows:
  ios-unsigned-release:
    name: Cinematy iOS Release Unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Flutter packages
        script: |
          flutter clean
          flutter pub get

      - name: Prepare iOS Release
        script: |
          flutter build ios \
            --release \
            --config-only \
            --no-codesign

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build Release without signing
        script: |
          cd ios

          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          cd ..

      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload

          cp -R \
            build/ios/derived/Build/Products/Release-iphoneos/Runner.app \
            build/ios/ipa/Payload/

          cd build/ios/ipa
          zip -qry Cinematy-Release-Unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/Cinematy-Release-Unsigned.ipa