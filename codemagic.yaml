workflows:
  cinematy-ios-release-unsigned:
    name: Cinematy iOS Release Unsigned ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare Flutter
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

          test -f ios/Runner/AppDelegate.swift
          test -f ios/Runner/SceneDelegate.swift
          grep -Fq 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy.native.scene.liquid.tabbar' ios/Runner/SceneDelegate.swift

      - name: Rebuild clean Flutter 3.41+ iOS project and restore native bar
        script: |
          set -euo pipefail

          # The checked-in legacy Runner.xcodeproj was malformed. Always take
          # project.pbxproj/Scene lifecycle files from the Flutter version that
          # CodeMagic is actually building with, then restore Cinematy native UI.
          cp ios/Runner/AppDelegate.swift /tmp/Cinematy-AppDelegate.swift
          cp ios/Runner/SceneDelegate.swift /tmp/Cinematy-SceneDelegate.swift

          rm -rf /tmp/cinematy_ios_template
          flutter create \
            --platforms=ios \
            --org com.cinematy \
            --project-name app \
            /tmp/cinematy_ios_template

          rm -rf ios
          cp -R /tmp/cinematy_ios_template/ios ./ios

          cp /tmp/Cinematy-AppDelegate.swift ios/Runner/AppDelegate.swift
          cp /tmp/Cinematy-SceneDelegate.swift ios/Runner/SceneDelegate.swift

          PBX="ios/Runner.xcodeproj/project.pbxproj"
          PLIST="ios/Runner/Info.plist"

          test -f "$PBX"
          test -f "$PLIST"
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          grep -Fq 'SceneDelegate.swift in Sources' "$PBX"
          grep -Fq 'CinematyTabBar' ios/Runner/SceneDelegate.swift

          # Fail here, before icon generation/build, if Xcode cannot parse the
          # freshly generated project. This directly guards the failure seen in
          # the previous build log.
          xcodebuild -project ios/Runner.xcodeproj -list

      - name: Apply Cinematy iOS and UIScene settings
        script: |
          set -euo pipefail

          PLIST="ios/Runner/Info.plist"
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path('ios/Runner/Info.plist')
          with path.open('rb') as f:
              p = plistlib.load(f)

          p['CFBundleDisplayName'] = 'سينماتي'
          p['CFBundleName'] = 'cinematy'
          p['NSAppTransportSecurity'] = {'NSAllowsArbitraryLoads': True}
          p['UISupportedInterfaceOrientations'] = [
              'UIInterfaceOrientationPortrait',
              'UIInterfaceOrientationLandscapeLeft',
              'UIInterfaceOrientationLandscapeRight',
          ]
          p.pop('UIDesignRequiresCompatibility', None)

          manifest = p.setdefault('UIApplicationSceneManifest', {})
          manifest['UIApplicationSupportsMultipleScenes'] = False
          configurations = manifest.setdefault('UISceneConfigurations', {})
          app_role = configurations.setdefault('UIWindowSceneSessionRoleApplication', [{}])
          if not app_role:
              app_role.append({})
          config = app_role[0]
          config['UISceneClassName'] = 'UIWindowScene'
          config['UISceneConfigurationName'] = 'flutter'
          config['UISceneDelegateClassName'] = '$(PRODUCT_MODULE_NAME).SceneDelegate'
          config['UISceneStoryboardFile'] = 'Main'

          with path.open('wb') as f:
              plistlib.dump(p, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' "$PBX"

          echo "Scene delegate configured as:"
          /usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$PLIST"

          SCENE_CLASS=$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$PLIST")
          test "$SCENE_CLASS" = '$(PRODUCT_MODULE_NAME).SceneDelegate'
          grep -Fq 'SceneDelegate.swift in Sources' "$PBX"
          grep -Fq 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy.native.scene.liquid.tabbar' ios/Runner/SceneDelegate.swift

          echo "Xcode:"
          xcodebuild -version

      - name: Generate Flutter iOS files and icon
        script: |
          set -euo pipefail
          flutter pub get
          dart run flutter_launcher_icons

          flutter build ios \
            --release \
            --config-only \
            --no-codesign

          # Flutter 3.41+ must remain on UIScene and must not overwrite the
          # custom SceneDelegate/AppDelegate restored above.
          grep -Fq 'FlutterImplicitEngineDelegate' ios/Runner/AppDelegate.swift
          grep -Fq 'cinematy.native.scene.liquid.tabbar' ios/Runner/SceneDelegate.swift
          grep -Fq 'SceneDelegate.swift in Sources' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          cd ..

      - name: Verify Xcode workspace before build
        script: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -list
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          grep -Fq 'SceneDelegate.swift in Sources' ios/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned Release
        script: |
          set -euo pipefail
          rm -rf build/ios/derived

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify final app contains UIScene native tab bar
        script: |
          set -euo pipefail

          APP_PATH=$(find build/ios/derived/Build/Products \
            -type d \
            -path "*Release-iphoneos/Runner.app" \
            -print \
            -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Release Runner.app was generated."
            exit 1
          fi

          echo "$APP_PATH" > /tmp/cinematy_runner_app
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Runner"

          if ! strings "$APP_PATH/Runner" | grep -Fq 'cinematy/native_tab_bar'; then
            echo "ERROR: Native tab-bar MethodChannel is missing from Runner binary."
            exit 1
          fi

          if ! strings "$APP_PATH/Runner" | grep -Fq 'cinematy.native.scene.liquid.tabbar'; then
            echo "ERROR: UIScene native UITabBar marker is missing from Runner binary."
            exit 1
          fi

          SCENE_CLASS=$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName' "$APP_PATH/Info.plist")
          if [ "$SCENE_CLASS" != '$(PRODUCT_MODULE_NAME).SceneDelegate' ] && [ "$SCENE_CLASS" != 'app.SceneDelegate' ] && [ "$SCENE_CLASS" != 'Runner.SceneDelegate' ]; then
            echo "ERROR: Built app is not configured to launch Cinematy SceneDelegate: $SCENE_CLASS"
            exit 1
          fi

          echo "PASS: final Runner binary contains Cinematy UIScene native UITabBar."
          echo "PASS: built Info.plist launches SceneDelegate."
          du -sh "$APP_PATH"

      - name: Create unsigned ZIP
        script: |
          set -euo pipefail
          APP_PATH=$(cat /tmp/cinematy_runner_app)

          rm -rf build/ios/output
          mkdir -p build/ios/output

          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            build/ios/output/Cinematy-Release-Unsigned.zip

          ZIP="build/ios/output/Cinematy-Release-Unsigned.zip"
          ls -lh "$ZIP"
          unzip -t "$ZIP"

          ZIP_BYTES=$(stat -f%z "$ZIP")
          if [ "$ZIP_BYTES" -lt 1000000 ]; then
            echo "ERROR: Final ZIP is less than 1 MB."
            exit 1
          fi

    artifacts:
      - build/ios/output/Cinematy-Release-Unsigned.zip

  cinematy-ios-debug-unsigned:
    name: Cinematy iOS Debug Unsigned ZIP
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare clean UIScene iOS project
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

          cp ios/Runner/AppDelegate.swift /tmp/Cinematy-AppDelegate.swift
          cp ios/Runner/SceneDelegate.swift /tmp/Cinematy-SceneDelegate.swift

          rm -rf /tmp/cinematy_ios_template
          flutter create \
            --platforms=ios \
            --org com.cinematy \
            --project-name app \
            /tmp/cinematy_ios_template

          rm -rf ios
          cp -R /tmp/cinematy_ios_template/ios ./ios
          cp /tmp/Cinematy-AppDelegate.swift ios/Runner/AppDelegate.swift
          cp /tmp/Cinematy-SceneDelegate.swift ios/Runner/SceneDelegate.swift

          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('ios/Runner/Info.plist')
          with path.open('rb') as f:
              p = plistlib.load(f)
          p['CFBundleDisplayName'] = 'سينماتي'
          p['NSAppTransportSecurity'] = {'NSAllowsArbitraryLoads': True}
          p.pop('UIDesignRequiresCompatibility', None)
          manifest = p.setdefault('UIApplicationSceneManifest', {})
          manifest['UIApplicationSupportsMultipleScenes'] = False
          configurations = manifest.setdefault('UISceneConfigurations', {})
          role = configurations.setdefault('UIWindowSceneSessionRoleApplication', [{}])
          if not role:
              role.append({})
          role[0]['UISceneClassName'] = 'UIWindowScene'
          role[0]['UISceneConfigurationName'] = 'flutter'
          role[0]['UISceneDelegateClassName'] = '$(PRODUCT_MODULE_NAME).SceneDelegate'
          role[0]['UISceneStoryboardFile'] = 'Main'
          with path.open('wb') as f:
              plistlib.dump(p, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          perl -0pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

          xcodebuild -project ios/Runner.xcodeproj -list
          grep -Fq 'SceneDelegate.swift in Sources' ios/Runner.xcodeproj/project.pbxproj

          dart run flutter_launcher_icons
          flutter build ios --debug --config-only --no-codesign

          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned Debug
        script: |
          set -euo pipefail
          rm -rf build/ios/derived

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and package Debug
        script: |
          set -euo pipefail

          APP_PATH=$(find build/ios/derived/Build/Products \
            -type d \
            -path "*Debug-iphoneos/Runner.app" \
            -print \
            -quit)

          test -n "$APP_PATH"
          test -f "$APP_PATH/Runner"
          strings "$APP_PATH/Runner" | grep -Fq 'cinematy/native_tab_bar'
          strings "$APP_PATH/Runner" | grep -Fq 'cinematy.native.scene.liquid.tabbar'

          rm -rf build/ios/output-debug
          mkdir -p build/ios/output-debug
          /usr/bin/ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            build/ios/output-debug/Cinematy-Debug-Unsigned.zip
          unzip -t build/ios/output-debug/Cinematy-Debug-Unsigned.zip

    artifacts:
      - build/ios/output-debug/Cinematy-Debug-Unsigned.zip
