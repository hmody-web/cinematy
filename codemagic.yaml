workflows:
  cinematy-ios-unsigned:
    name: Cinematy iOS Unsigned
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare Flutter
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned iOS app
        script: |
          flutter build ios --debug --no-codesign

      - name: Verify Runner.app
        script: |
          APP="build/ios/iphoneos/Runner.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Runner.app not found"
            find build/ios -maxdepth 5 -type d -name "*.app" -print
            exit 1
          fi

          echo "Runner.app found:"
          du -sh "$APP"

      - name: Create unsigned IPA
        script: |
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload

          cp -R build/ios/iphoneos/Runner.app \
                build/ios/ipa/Payload/Runner.app

          echo "Payload size:"
          du -sh build/ios/ipa/Payload

          cd build/ios/ipa
          zip -r -9 Cinematy-Unsigned.ipa Payload

          echo "Final IPA:"
          ls -lh Cinematy-Unsigned.ipa

          SIZE=$(stat -f%z Cinematy-Unsigned.ipa)

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: IPA is suspiciously small: $SIZE bytes"
            exit 1
          fi

    artifacts:
      - build/ios/ipa/Cinematy-Unsigned.ipa
      - build/ios/iphoneos/Runner.app